name: Isolated Linux lab

on:
  push:
    branches: [linux-compatibility]
    paths:
      - '.github/workflows/linux-lab.yml'
      - 'app/**'
      - 'mcp/**'
      - 'ops/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-linux:
    name: Linux synthetic tests (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - variant: current-main-linux
            ref: ${{ github.sha }}
          - variant: separate-direct-ai
            ref: 926f3e6165853c5f864d0a4bca7b68f934feec8a
    steps:
      - name: Checkout source only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Record source and Linux kernel
        run: |
          git rev-parse HEAD
          uname -a
          docker version --format '{{.Server.Version}}'
      - name: Build and run network-isolated synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          sh ops/linux/run-lab.sh 2>&1 | tee "$RUNNER_TEMP/lu-linux-lab.log"
      - name: Native systemd, filesystem and restore acceptance
        if: matrix.variant == 'current-main-linux'
        shell: bash
        env:
          LU_DISPOSABLE_LINUX_LAB: synthetic-only
        run: bash ops/linux/native-lab.sh
      - name: Summarize test result
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/lu-linux-lab.log"; then
            tail -n 18 "$RUNNER_TEMP/lu-linux-lab.log" >> "$GITHUB_STEP_SUMMARY"
          fi
