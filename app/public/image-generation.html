<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Képgenerálás áttekintése · Living Universe</title><link rel="stylesheet" href="/mobile.css"><link rel="stylesheet" href="/image-generation.css"></head>
<body><main class="generation"><a href="/">Living Universe</a><h1 data-i18n="gen.title"></h1>
<p id="status" role="status" aria-live="polite" data-i18n="gen.loading"></p><p id="provider"></p><p id="cost"></p>
<p data-i18n="gen.intro"></p>
<h2 data-i18n="gen.referencesTitle"></h2><div id="references"></div>
<details open><summary data-i18n="gen.prompt"></summary><pre id="prompt"></pre></details>
<details><summary data-i18n="gen.manifest"></summary><pre id="manifest"></pre></details>
<section id="approval" hidden><label><input type="checkbox" id="ack"> <span data-i18n="gen.ack"></span></label><div class="actions"><button id="approve" disabled data-i18n="gen.approve"></button><button id="reject" data-i18n="change.reject"></button></div></section>
<div class="actions"><button id="execute" hidden data-i18n="gen.generate"></button><button id="withdraw" hidden data-i18n="gen.withdraw"></button><button id="refresh" data-i18n="gen.refresh"></button></div>
<div id="output"></div><p data-i18n="gen.separateNote"></p><p id="error" role="alert"></p>
</main><script type="module" src="/image-generation.js"></script></body></html>
